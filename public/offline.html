<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>TrustLens</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef1ef;
        --text: #0f1c22;
        --muted: #46565d;
        --accent: #2340c4;
        --on-accent: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a2336;
          --text: #e8efef;
          --muted: #aab6bb;
          --accent: #8fa2ff;
          --on-accent: #101830;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font:
          1rem/1.55 system-ui,
          sans-serif;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      img {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.5rem;
        line-height: 1.2;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }
      button {
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1 id="title">You are offline</h1>
      <p id="text">
        TrustLens needs a connection to load this page. Check your network and try again.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>

          "retry": "重试"
        },
        "zh-TW": {
          "dir": "ltr",
          "title": "你已離線",

          "retry": "重試"
        },

        },
        "fr": {
          "dir": "ltr",
          "title": "Vous êtes hors ligne",

          "retry": "Réessayer"
        },
        "ar": {
          "dir": "rtl",

          "retry": "حاول مرة أخرى"
        },
        "bn": {

        "pl": {
          "dir": "ltr",
          "title": "Jesteś offline",
          "text": "TrustLens potrzebuje połączenia, aby wczytać tę stronę. Sprawdź sieć i spróbuj ponownie.",
          "retry": "Spróbuj ponownie"

        "nl": {
          "dir": "ltr",
          "title": "Je bent offline",
          "text": "TrustLens heeft een verbinding nodig om deze pagina te laden. Controleer je netwerk en probeer het opnieuw.",
          "retry": "Opnieuw proberen"
        }
      }
    </script>
    <script>
      (function () {
        var messages = JSON.parse(document.getElementById('messages').textContent);
        function pick() {
          var list =
            navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language];
          for (var i = 0; i < list.length; i++) {
            var tag = String(list[i] || '');
            if (messages[tag]) return tag;
            var base = tag.split('-')[0].toLowerCase();
            if (base === 'zh') return /-(tw|hk|mo|hant)/i.test(tag) ? 'zh-TW' : 'zh-CN';
            if (base === 'pt') return 'pt-BR';
            if (messages[base]) return base;
          }
          return 'en';
        }
        var code = pick();
        var m = messages[code];
        document.documentElement.lang = code;
        document.documentElement.dir = m.dir;
        document.getElementById('title').textContent = m.title;
        document.getElementById('text').textContent = m.text;
        document.getElementById('retry').textContent = m.retry;
        document.getElementById('retry').addEventListener('click', function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
